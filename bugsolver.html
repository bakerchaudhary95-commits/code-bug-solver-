<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Bug Solver</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1e293b; }
        label { font-weight: 600; font-size: 14px; display: block; margin-top: 15px; margin-bottom: 5px; }
        select, textarea, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px; }
        textarea { height: 120px; font-family: monospace; }
        button.analyze-btn { background: #2563eb; color: white; font-weight: bold; border: none; margin-top: 15px; cursor: pointer; transition: 0.2s; }
        button.analyze-btn:hover { background: #1d4ed8; }
        .output-box { margin-top: 20px; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; white-space: pre-wrap; font-family: monospace; display: none; }
        .paywall-box { margin-top: 25px; padding: 20px; background: #fff7ed; border: 1px solid #ffedd5; border-radius: 8px; text-align: center; display: none; }
        .paywall-btn { background: #ea580c; color: white; font-weight: bold; border: none; padding: 12px 20px; text-decoration: none; display: inline-block; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Code Bug Solver</h2>
    
    <label>Programming Language</label>
    <select id="language">
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="C++">C++</option>
        <option value="Java">Java</option>
        <option value="PHP">PHP</option>
    </select>

    <label>Paste Source Code</label>
    <textarea id="code" placeholder="Paste your buggy code here..."></textarea>

    <button class="analyze-btn" onclick="fixCode()">Analyze & Fix Bug</button>

    <div id="output" class="output-box"></div>

    <div id="paywall" class="paywall-box">
        <h3>Free Uses Finished!</h3>
        <p>Unlock unlimited code bug fixing for just $5.</p>
        <a href="#" class="paywall-btn">Get Unlimited Access ($5)</a>
    </div>
</div>

<script>
    let usageCount = localStorage.getItem('usageCount') || 0;
    const API_KEY = "AQ.Ab8RN6IIO2WF5R8UMaKBqOA7v8CFZuK1M5MRBWjbNWz0bkgMeA";

    async function fixCode() {
        if (usageCount >= 3) {
            document.getElementById('paywall').style.display = 'block';
            alert('Free usage limit reached. Please upgrade to Pro.');
            return;
        }

        const code = document.getElementById('code').value;
        const lang = document.getElementById('language').value;
        const output = document.getElementById('output');

        if (!code) { alert('Paste some code first!'); return; }

        output.style.display = 'block';
        output.innerText = 'Analyzing code...';

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Fix the bug in this ${lang} code and explain briefly:\n\n${code}` }] }]
                })
            });

            const data = await res.json();
            
            if (data.candidates && data.candidates.length > 0) {
                const result = data.candidates[0].content.parts[0].text;
                output.innerText = result;
                usageCount++;
                localStorage.setItem('usageCount', usageCount);
            } else {
                output.innerText = 'Error: ' + (data.error ? data.error.message : 'Invalid response from API');
            }

        } catch (error) {
            output.innerText = 'Error processing request. Check your network or API key.';
        }
    }
</script>

</body>
</html>
